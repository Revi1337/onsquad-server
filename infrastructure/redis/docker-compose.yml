networks:
  redis-net:
    name: redis-net

services:
  redis:
    image: redis:8.2
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data:/data
    networks:
      - redis-net
