# master / replica 공통 설정. 노드마다 다른 값(replicaof, replica-announce-port)은 docker-compose.yml 의 command 에 있습니다.
port 6379
bind 0.0.0.0
protected-mode no

dir /data
dbfilename backup.rdb
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error no

appendonly yes
appendfilename appendonly.aof
appendfsync everysec

replica-announce-ip host.docker.internal
