<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="x-apple-disable-message-reformatting"/>
    <meta name="color-scheme" content="light only"/>
    <meta name="supported-color-schemes" content="light only"/>
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no"/>
    <title>온스쿼드 이메일 인증코드</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style type="text/css">
        /* Client resets */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
        }

        * {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }

        table, td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
            border-collapse: collapse !important;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        a {
            text-decoration: none;
        }

        /* Prevent Gmail/iOS auto-linking from restyling text */
        a[x-apple-data-detectors], .unstyle-auto-detected-links a, .aBn {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }

        /* Mobile */
        @media only screen and (max-width: 600px) {
            .email-card {
                width: 100% !important;
                max-width: 100% !important;
            }

            .email-wrap {
                width: 100% !important;
            }
        }
    </style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#181818;">
<!-- Preheader (inbox preview text, hidden) -->
<div style="display:none; overflow:hidden; line-height:1px; opacity:0; max-height:0; max-width:0; font-size:1px; color:#181818;">
    온스쿼드 이메일 인증코드가 발급되었습니다. 아래 코드를 입력해 주세요.&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
</div>

<!-- Outer wrapper: solid color fallback always present -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#181818" style="background-color:#181818;">
    <tr>
        <td align="center" valign="top" style="padding:0;">

            <!-- 600px frame that carries the illustration background (with solid fallback) -->
            <table role="presentation" class="email-wrap" width="600" cellpadding="0" cellspacing="0" border="0" align="center"
                   style="width:600px; max-width:600px;">
                <tr>
                    <td
                            background="{{ASSET_BASE_URL}}/bg.jpg"
                            bgcolor="#181818"
                            valign="top"
                            align="center"
                            style="background-color:#181818; background-image:url('{{ASSET_BASE_URL}}/bg.jpg'); background-repeat:no-repeat; background-position:top center; background-size:600px auto; padding:0;">

                        <!--[if gte mso 9]>
                        <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;" filled="true">
                            <v:fill type="frame" src="{{ASSET_BASE_URL}}/bg.jpg" color="#181818"/>
                            <v:textbox inset="0,0,0,0">
                        <![endif]-->

                        <!-- Vertical layout table to control spacing above/below the card -->
                        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="width:600px; max-width:600px;">
                            <tr>
                                <td height="28" style="font-size:0; line-height:0;">&nbsp;</td>
                            </tr>
                            <tr>
                                <td align="center" valign="top" style="padding:0;">

                                    <!-- White card: always readable regardless of background image -->
                                    <table role="presentation" class="email-card" width="480" cellpadding="0" cellspacing="0" border="0" align="center"
                                           bgcolor="#ffffff" style="width:480px; max-width:480px; background-color:#ffffff; border-radius:16px;">
                                        <tr>
                                            <td align="center" valign="top"
                                                style="padding:40px 32px 36px 32px; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

                                                <!-- Wordmark -->
                                                <img src="{{ASSET_BASE_URL}}/logo-wordmark.png" width="104" height="22" alt="ONSQUAD"
                                                     style="display:block; width:104px; height:auto; border:0; outline:none;"/>

                                                <!-- Brand name -->
                                                <div style="padding-top:8px; font-size:40px; line-height:1.2; font-weight:700; color:#181600;">온스쿼드</div>

                                                <!-- Title -->
                                                <div style="padding-top:28px; font-size:20px; line-height:1.3; font-weight:700; color:#181600;">이메일 인증코드</div>

                                                <!-- Description -->
                                                <div style="padding-top:8px; font-size:16px; line-height:1.5; font-weight:500; color:#181600;">
                                                    인증코드가 발급되었습니다.<br/>아래의 인증코드를 입력해 주세요.
                                                </div>

                                                <!-- Code box -->
                                                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"
                                                       style="margin:28px auto 0 auto;">
                                                    <tr>
                                                        <td align="center" bgcolor="#e6e6e6"
                                                            style="background-color:#e6e6e6; padding:10px 16px; border-radius:6px;">
                                                            <span style="font-size:24px; line-height:1.2; font-weight:600; color:#181600; letter-spacing:6px; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', Consolas, monospace;">{{AUTH_CODE}}</span>
                                                        </td>
                                                    </tr>
                                                </table>

                                                <!-- Expiry -->
                                                <div style="padding-top:10px; font-size:16px; line-height:1.5; font-weight:400; color:#909090;">유효기간:
                                                    {{EXPIRES_AT}} 까지
                                                </div>

                                                <!-- Footer brand -->
                                                <div style="padding-top:24px;">
                                                    <img src="{{ASSET_BASE_URL}}/logo-mark.png" width="30" height="28" alt=""
                                                         style="display:inline-block; width:30px; height:28px; border:0; outline:none;"/>
                                                </div>
                                                <div style="padding-top:4px; font-size:12px; line-height:1.3; font-weight:700; color:#ff6b00;">온스쿼드</div>
                                                <div style="padding-top:8px; font-size:12px; line-height:1.33; font-weight:500; color:#909090;">
                                                    취미생활의 아지트, 온스쿼드!<br/>지금 바로 합류하세요!
                                                </div>

                                            </td>
                                        </tr>
                                    </table>
                                    <!-- /White card -->

                                </td>
                            </tr>
                            <!-- Bottom spacer: lets the illustration's lower scene show when the bg loads -->
                            <tr>
                                <td height="180" style="font-size:0; line-height:0;">&nbsp;</td>
                            </tr>
                        </table>

                        <!--[if gte mso 9]>
                        </v:textbox>
                        </v:rect>
                        <![endif]-->

                    </td>
                </tr>
            </table>
            <!-- /600px frame -->

        </td>
    </tr>
</table>
</body>
</html>
